<script>
/* start the data downloads immediately, in parallel with the scripts */
window.CORE_FILES = ['meta', 'employees', 'moves', 'cost_monthly', 'budget_monthly', 'finance_monthly', 'production_monthly', 'requisitions', 'key_positions', 'model_forecast', 'model_attrition', 'model_segments'];
window.PRE = {};
window.CORE_FILES.forEach(function (f) { window.PRE[f] = fetch('data/' + f + '.json').then(function (r) { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); }); window.PRE[f].catch(function () {}); });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--surface:#FFFFFF;--line:#E8E9EE;--line-soft:#F1F2F5;--ink:#0F172A;--text:#1F2937;--muted:#5B6170;--navy:#13405B;--navy-2:#1E5577;--on-navy:#CFE0EA;--purple:#784791;--purple-ink:#5E3573;--purple-soft:#F3EDF7;--orange:#F08A00;--orange-ink:#8A4B00;--orange-strong:#A85A00;--orange-soft:#FFF6EA;--lilac:#B08CC4;--green-soft:#E9F5EF;--green-ink:#0B5D3B;--green:#12925A;--red-ink:#B42318;--axis:#CBD0D8;--sky:#5B8DB0;--grey:#C3C8D1;--radius:16px;
--font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;accent-color:var(--purple);scrollbar-color:#C9CDD6 transparent}
::selection{background:#E7DCEF;color:var(--navy)}
a{color:var(--purple-ink);text-underline-offset:3px}a:hover{color:var(--navy)}
button{font:inherit;cursor:pointer;color:inherit}
a,button{transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch}
.side{flex:1 1 232px;max-width:256px;min-width:228px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.brand b{display:block;font-size:14px;color:var(--navy)}.brand small{display:block;font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;color:#4B5563;text-decoration:none;font-weight:500}
.nav a:hover{background:#F5F1F8;color:var(--purple-ink)}
.nav a[aria-current="page"]{background:var(--purple-soft);color:var(--purple-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav-group{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.nav-label{display:flex;align-items:center;gap:10px;padding:6px 12px 4px;font-size:13px;font-weight:600;color:var(--navy)}
.nav-label svg{width:18px;height:18px;flex:none;color:#4B5563}
.nav-group a{padding-left:40px;min-height:36px;font-size:13.5px}
.nav-group a.active-parent{color:var(--purple-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 8px 0;border-top:1px solid #EEF0F3;font-size:12px;color:var(--muted);line-height:1.5}
.side-foot a{font-weight:600}
.main{flex:999 1 560px;min-width:0;padding:26px 36px 48px;display:flex;flex-direction:column;gap:20px;max-width:1260px}

/* ---------- header & controls ---------- */
.head{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:center;justify-content:space-between}
.head h1{font-weight:700;font-size:26px;letter-spacing:-.01em;color:var(--navy);text-wrap:balance}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;flex:none}
.chip-demo{background:var(--orange-soft);color:var(--orange-ink);border:1px solid #F6CF9A}.chip-demo i{background:var(--orange)}
.chip-date{background:var(--green-soft);color:var(--green-ink)}.chip-date i{background:var(--green)}
.seg-sm{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:#fff;border:1px solid #DCDEE5}
.seg-sm button{border:0;background:transparent;min-height:30px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:#4B5563;white-space:nowrap}
.seg-sm button:hover{background:var(--line-soft);color:var(--navy)}
.seg-sm button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{font-size:13px;font-weight:600;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #DCDEE5;background:var(--surface);color:var(--navy);display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:#B9BDC8}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
@media (min-width:761px){.toolbar{position:sticky;top:0;z-index:25;background:var(--bg);padding:10px 0;margin:-10px 0}}
.toolbar.stuck{box-shadow:0 8px 12px -12px rgba(15,23,42,.35)}
.scope{display:flex;align-items:center;gap:10px}
.scope-label{font-size:12px;font-weight:600;color:var(--muted)}
.scope-seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:#fff;border:1px solid #DCDEE5}
.scope-seg button{border:0;background:transparent;min-height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:#4B5563;white-space:nowrap}
.scope-seg button:hover{background:var(--line-soft);color:var(--navy)}
.scope-seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.tb-div{width:1px;height:24px;background:#DCDEE5}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters-note{font-size:12px;color:var(--muted)}
details.ms{position:relative}
details.ms>summary{list-style:none;font-size:13px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #DCDEE5;background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
details.ms>summary::-webkit-details-marker{display:none}
details.ms>summary:hover{border-color:#B9BDC8}
details.ms.active>summary{border-color:var(--purple);background:var(--purple-soft);color:var(--purple-ink)}
details.ms[open]>summary{border-color:var(--purple)}
details.ms.off>summary{opacity:.45;pointer-events:none}
.ms-panel{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:min(300px,86vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.12);padding:10px;display:flex;flex-direction:column;gap:8px}
.ms-actions{display:flex;gap:8px}
.ms-actions button{font-size:12px;font-weight:600;border:1px solid #DCDEE5;background:#fff;border-radius:8px;padding:6px 10px;color:var(--navy)}
.ms-list{max-height:280px;overflow:auto;display:flex;flex-direction:column}
.ms-list label{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:6px;font-size:13px;cursor:pointer}
.ms-list label:hover{background:#F5F6F8}
.reset{border:0;background:none;color:var(--purple-ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 6px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 12px;justify-content:space-between;align-items:center}
.card-head>div:first-child{display:flex;flex-direction:column;gap:3px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.grid-io{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.7fr);gap:16px;align-items:start}
@media (max-width:1000px){.grid-io{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.lead{display:flex;flex-wrap:wrap;gap:12px}
.hero{flex:1 1 280px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.hero-label{font-size:13px;color:var(--on-navy);display:flex;align-items:center;gap:6px}
.hero-value{font-size:42px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.hero-value small{font-size:16px;font-weight:500;color:var(--on-navy);margin-left:4px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--on-navy);text-align:right}
.hero-side b{font-size:20px;font-weight:600;color:#fff;white-space:nowrap}
.pill-up,.pill-down,.pill-flat{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--navy-2)}
.pill-up{color:#D6F5E5}.pill-down{color:#FFD8A8}.pill-flat{color:var(--on-navy)}
.strip{flex:4 1 560px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));min-width:0}
.stat{padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px;border-right:1px solid #EEF0F3;min-width:0}
.stat:last-child{border-right:0}
.stat-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.stat-value{font-size:26px;font-weight:700;color:var(--navy);line-height:1.15;white-space:nowrap}
.stat-value small{font-size:14px;font-weight:500;color:var(--muted)}
.stat-sub{font-size:12px;color:var(--muted)}
.c-purple{color:var(--purple-ink)!important}.c-orange{color:var(--orange-strong)!important}.c-green{color:var(--green-ink)!important}.c-red{color:var(--red-ink)!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#374151}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .ln{width:14px;height:0;border-top:2px dashed #374151;border-radius:0}
.empty{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:16px;border:1px dashed #DCDEE5;border-radius:12px}
.badge-model{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--purple-soft);color:var(--purple-ink);font-size:12px;font-weight:600}

/* ---------- so what ---------- */
.sowhat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.sowhat h2{font-size:15px;font-weight:700;color:var(--navy)}
.sw-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px 24px}
.sw-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55;color:var(--text)}
.sw-item .dot{flex:none;margin-top:6px;width:8px;height:8px;border-radius:50%}
.sw-item p+p{margin-top:4px}
.sw-act{color:var(--muted);font-size:12.5px}
.sw-item>div>p:first-child{font-weight:500;color:var(--ink)}
.sw-act b{font-weight:700;color:var(--purple-ink)}

/* ---------- info (formula) ---------- */
.info{border:0;background:none;padding:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#8A90A0;flex:none;vertical-align:middle}
.info:hover,.info:focus-visible{color:var(--purple-ink);background:var(--purple-soft)}
.info svg{width:15px;height:15px}
.hero .info{color:var(--on-navy)}.hero .info:hover,.hero .info:focus-visible{background:var(--navy-2);color:#fff}

/* ---------- charts ---------- */
.page{display:flex;flex-direction:column;gap:20px}
#content{min-width:0}
.scrollx{overflow-x:auto;overflow-y:hidden}
.cols{display:grid;gap:8px;align-items:stretch;border-bottom:1px solid var(--axis)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0;position:relative}
.col .v{font-size:11px;font-weight:600;color:var(--navy);white-space:nowrap}
.col .b{width:64%;max-width:40px;border-radius:5px 5px 1px 1px;min-height:2px}
.col .tk{position:absolute;left:12%;right:12%;height:0;border-top:2px dashed #374151}
.xlabels{display:grid;gap:8px;margin-top:6px}
.xlabels span{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;white-space:pre-line;min-width:0;overflow:hidden;text-overflow:ellipsis}
.flow{display:grid;gap:6px}
.flow-col{display:flex;flex-direction:column;align-items:center;min-width:0;border-radius:6px}
.flow-col .v{font-size:11px;font-weight:600;white-space:nowrap}
.flow-col .xl{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap}
.flow-up{height:120px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.flow-dn{height:86px;width:100%;display:flex;flex-direction:column;align-items:center}
.flow-bar{width:58%;max-width:34px}
.flow-zero{width:100%;height:1px;background:var(--axis);margin:3px 0}
.stk{display:flex;flex-direction:column-reverse;width:62%;max-width:36px;border-radius:5px 5px 1px 1px;overflow:hidden;gap:1px}
.stk>div{width:100%}
.hrow{display:flex;flex-direction:column;gap:6px}
.hrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px}
.hrow-top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:500}
.hrow-top>span:last-child{white-space:nowrap}
.track{height:10px;background:var(--line-soft);border-radius:999px;position:relative}
.track>div.f{height:100%;border-radius:999px}
.track .mk{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px solid #374151}
.hbars{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.div-row{display:grid;grid-template-columns:minmax(110px,220px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.div-row>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.div-row>span:last-child{text-align:right;font-weight:700}
.div-track{position:relative;height:14px}
.div-track .z{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--axis)}
.div-track .bar{position:absolute;top:2px;height:10px;border-radius:3px}
.stack{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px}
.stack>div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.srow{display:grid;grid-template-columns:minmax(96px,180px) minmax(0,1fr);gap:12px;align-items:center}
.srow>span{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .stack{height:24px;border-radius:7px}
.funnel{display:flex;flex-direction:column;gap:8px}
.fn-row{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:13px}
.fn-row .fb{height:30px;border-radius:7px;background:var(--purple);margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;min-width:34px}
.fn-row .cv{font-size:12px;color:var(--muted);text-align:right}
.g9{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(64px,auto)) 26px;gap:4px}
.g9 .cell{border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;cursor:default}
.g9 .cell b{font-size:18px;line-height:1.1}
.g9 .cell span{font-size:11.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.g9 .yl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.g9 .xl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.g9-ax{font-size:12px;color:var(--muted);padding-left:32px;text-align:center}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--font)}
svg[data-line]{cursor:crosshair;touch-action:pan-y}

/* ---------- tooltip ---------- */
#tip{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:#0F172A;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.45;box-shadow:0 10px 28px rgba(15,23,42,.28);display:grid;grid-template-columns:auto auto;gap:2px 16px;max-width:300px}
#tip b{grid-column:1/-1;font-size:12.5px;font-weight:700;margin-bottom:3px}
#tip span{color:#CBD5E1}#tip em{font-style:normal;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#tip.def{display:block;max-width:330px}#tip.def p{margin:0;color:#E2E8F0}#tip.def p+p{margin-top:6px;color:#CBD5E1}
.col[data-tip],.flow-col[data-tip],.cell[data-tip],.fn-row[data-tip]{transition:background-color .15s ease}
.col[data-tip]:hover,.flow-col[data-tip]:hover{background:rgba(120,71,145,.07);border-radius:6px}
.stack>[data-tip]:hover{filter:brightness(1.08)}
.cell[data-tip]:hover{filter:brightness(.97)}

/* ---------- tables ---------- */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--line-soft);border-radius:12px;align-self:flex-start}
.seg button{font-size:13px;font-weight:600;min-height:36px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:#4B5563}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.seg button span{font-weight:500;color:var(--muted);margin-left:4px}
.tools{display:flex;flex-wrap:wrap;gap:10px 12px;justify-content:space-between;align-items:center}
.search{display:flex;align-items:center;gap:8px;font-size:13px;color:#374151}
.search input{font:inherit;font-size:13px;min-height:40px;padding:0 12px;border:1px solid #DCDEE5;border-radius:10px;width:min(240px,60vw)}
.tbl{font-size:13px}
.tr{display:grid;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.tr.th{padding:8px 12px;color:var(--muted);font-size:12px;font-weight:600;border-bottom:1px solid #EEF0F3;background:#fff}
.tr:not(.th):hover{background:#FAFAFC}
.tr .num{text-align:right}
.cell-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-in{background:var(--purple-soft);color:var(--purple-ink)}.t-out{background:#FFF1E0;color:var(--orange-ink)}.t-sched{background:#E8EEF3;color:var(--navy)}.t-ok{background:var(--green-soft);color:var(--green-ink)}.t-grey{background:var(--line-soft);color:#374151}.t-high{background:#FDECEA;color:#8A1C12}
.monthbtn{border:0;background:transparent;font-size:13px;min-height:38px;width:100%;text-align:left;padding:0 8px;border-radius:8px;color:var(--navy);font-weight:500}
.tr.sel{background:#F7F2FA}.tr.sel .monthbtn{font-weight:700}
.pager{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid #EEF0F3;padding-top:12px}
.pager div{display:flex;gap:8px}

/* ---------- predictive ---------- */
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px 24px}
.sl{display:flex;flex-direction:column;gap:6px}
.sl label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text);font-weight:500}
.sl label b{color:var(--navy);font-size:15px}
.sl input[type=range]{width:100%;min-height:28px}
.sl small{font-size:11.5px;color:var(--muted)}
.seg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px 32px}
.seg-card{border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 2px;display:flex;flex-direction:column;gap:8px;min-width:0}
.seg-card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.seg-card h3 i{width:10px;height:10px;border-radius:50%;flex:none}
.seg-card .big{font-size:22px;font-weight:700;color:var(--navy)}
.seg-card dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:12.5px}
.seg-card dt{color:var(--muted)}.seg-card dd{margin:0;font-weight:600;text-align:right}
.seg-card p{font-size:12.5px;line-height:1.5;color:var(--text)}

details.defs{font-size:12px;color:var(--muted)}
details.defs summary{cursor:pointer;font-weight:600;color:var(--navy);min-height:36px;display:inline-flex;align-items:center}
.defs-body{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px 24px;line-height:1.55;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.defs-body b{color:var(--ink)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:40px 0}
.err{padding:14px 18px;border:1px solid #F6CF9A;background:var(--orange-soft);color:#6B3A00;border-radius:14px;font-size:14px;line-height:1.5}


/* ---------- plain-language helpers ---------- */
details.guide>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:999px;background:var(--purple-soft);color:var(--purple-ink);font-weight:600;font-size:13px;user-select:none}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary:hover{background:#EBE0F2}
details.guide>summary svg{width:16px;height:16px;flex:none}
details.guide>summary::after{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);margin-left:2px;transition:transform .2s ease}
details.guide[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.guide-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 32px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.guide-body h3{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:3px;letter-spacing:.01em}
.guide-body p{font-size:13px;line-height:1.55;color:var(--text);max-width:62ch}
.sw-sub{font-size:12px;color:var(--muted);margin-top:-6px}
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px 28px}
.glossary dt{font-weight:700;color:var(--navy);font-size:13px}.glossary dd{margin:2px 0 0;font-size:13px;line-height:1.55;color:var(--text)}
.linklike{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--purple-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.seg-intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 32px}
.seg-intro h3,.how h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
.seg-intro p,.how p{font-size:13.5px;line-height:1.6;color:var(--text)}
.facts{margin:0 0 8px;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.5;color:var(--text)}
.how{background:var(--purple-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.seg-card .tagline{font-size:13px;color:var(--muted);line-height:1.5}
.seg-card .act{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:2px}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{display:inline-flex;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px}
.trait.good{background:var(--green-soft);color:var(--green-ink)}.trait.warn{background:#FFF1E0;color:var(--orange-ink)}.trait.neutral{background:var(--purple-soft);color:var(--purple-ink)}
details.analyst{font-size:12.5px;color:var(--muted)}details.analyst summary{cursor:pointer;font-weight:600;color:var(--navy);min-height:36px;display:inline-flex;align-items:center}
details.analyst p{margin-top:6px;line-height:1.55}
details.analyst>summary,details.defs>summary{list-style:none;display:inline-flex;align-items:center;gap:8px}
details.analyst>summary::-webkit-details-marker,details.defs>summary::-webkit-details-marker{display:none}
details.analyst>summary::after,details.defs>summary::after{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s ease;opacity:.7}
details.analyst[open]>summary::after,details.defs[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.main>details.defs,.main>details.analyst{margin-top:-8px}
/* ---------- group comparison table ---------- */
.seg-table-wrap{overflow-x:auto}
.seg-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;min-width:720px}
.seg-table th,.seg-table td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.seg-table thead th{border-bottom:1px solid var(--line);padding:4px 14px 12px;vertical-align:bottom}
.seg-table thead th:first-child,.seg-table tbody th{width:20%;padding-left:0}
.seg-table tbody th{font-weight:500;color:var(--muted)}
.seg-table tbody tr:last-child th,.seg-table tbody tr:last-child td{border-bottom:0}
.seg-table tr.num td{font-weight:600;color:var(--ink);font-size:14px}
.seg-table tr.who td{color:var(--muted);line-height:1.5}
.seg-table tr.next td{color:var(--text);line-height:1.5}
.seg-table tr.next th,.seg-table tr.next td{padding-top:12px}
.seg-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.3}
.seg-name i{width:10px;height:10px;border-radius:50%;flex:none}
.seg-n{display:block;margin-top:3px;padding-left:18px;font-size:12px;font-weight:500;color:var(--muted)}
.hl-good{color:var(--green-ink)!important}.hl-warn{color:var(--orange-strong)!important}
td.hl-good,td.hl-warn,dd.hl-good,dd.hl-warn{font-weight:700}
.seg-key{margin-top:-4px}
.seg-mobile{display:none}
.seg-mobile .seg-card h3{flex-wrap:wrap;row-gap:2px}
.seg-mobile .seg-card h3 small{flex-basis:100%;font-weight:500;margin-left:18px}
@media (max-width:1099px){.seg-table-wrap{display:none}.seg-mobile{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 32px}}
@media (min-width:560px) and (max-width:1099px){.seg-mobile{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- motion ---------- */
.gy{transform-origin:bottom}.gyd{transform-origin:top}.gx{transform-origin:left}
@media (prefers-reduced-motion:no-preference){
  .play .fade{animation:fade .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
  .play .gy,.play .gyd{animation:gy .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*25ms + 120ms)}
  .play .gx{animation:gx .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms + 120ms)}
  .play .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .25s cubic-bezier(.4,0,.2,1) forwards}
  .play .area{animation:fadeonly .8s .5s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
  @keyframes gy{from{transform:scaleY(0)}}
  @keyframes gx{from{transform:scaleX(0)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadeonly{from{opacity:0}}
}
@media (prefers-reduced-motion:reduce){a,button{transition:none}}

/* ---------- responsive ---------- */
@media (max-width:760px){
  .side{max-width:none;min-width:0;flex:1 1 100%;height:auto;position:static;padding:12px 12px 8px;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:thin}
  .nav a{white-space:nowrap;min-height:40px;padding:0 12px}
  .nav-group{flex-direction:row;margin:0;gap:4px;align-items:center}
  .nav-label{display:none}
  .nav-group a{padding:0 12px;font-size:13.5px}
  .nav-group+.nav-group,.nav>a+.nav-group,.nav-group+a{border-left:1px solid var(--line);padding-left:4px}
  .nav svg{display:none}
  .side-foot{display:none}
  .main{padding:18px 14px 40px;gap:16px}
  .btn,.seg button,details.ms>summary,.reset,.monthbtn,.seg-sm button,.scope-seg button{min-height:44px}
  .head h1{font-size:22px}.hero-value{font-size:36px}
  .scope{width:100%;min-width:0}.scope-seg{flex:1;display:grid;grid-template-columns:repeat(3,1fr)}.scope-seg button{padding:0 6px}
  .tb-div{display:none}
  .stat{padding:14px 14px}.stat-value{font-size:22px}
  .card{padding:16px 16px}
  .fn-row{grid-template-columns:84px minmax(0,1fr) 92px;gap:8px}
  .filters{position:relative}details.ms{position:static}.ms-panel{left:0;right:0;width:auto}
  .scope-seg{min-width:0;grid-template-columns:repeat(3,minmax(0,1fr))}.scope-seg button{white-space:normal;line-height:1.15;font-size:12.5px}.ms-actions{flex-wrap:wrap}
  .div-row{grid-template-columns:minmax(80px,120px) minmax(0,1fr) 56px}
  .srow{grid-template-columns:minmax(80px,120px) minmax(0,1fr)}
}
</style></head>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark" aria-hidden="true">D</div><div><b>Demo Corp</b><small id="brand-sub">People Analytics</small></div></div>
    <nav class="nav" id="nav" aria-label="Dashboard pages"></nav>

  <main class="main" id="main">
    <header class="head">

        <span class="chip chip-demo" id="chip-demo"><i></i><span>Demo · synthetic data</span></span>
        <span class="chip chip-date" id="chip-date" hidden><i></i><span></span></span>
        <div class="seg-sm" role="group" aria-label="Language" id="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="id">ID</button></div>
      </div>

    <div class="toolbar" id="toolbar"><div class="scope" id="period"></div><span class="tb-div"></span><section class="filters" id="filters" aria-label="Filters"></section></div>

</div>
